[project]
name = "product-intake"
version = "0.1.0"
description = "Four-screen product intake through Shopify draft (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "pillow>=10.0.0",
  "pydantic>=2.0.0",
  "jinja2>=3.1.0",
  "python-dotenv>=1.0.0",
]

[tool.vercel]
# FastAPI instance: app.py → `app` (not a Vite project)
entrypoint = "app:app"
